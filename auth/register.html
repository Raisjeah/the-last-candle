<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - The Last Candle</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <h1 class="register-title">The Last Candle</h1>
            <p class="register-subtitle">Bergabunglah dengan Komunitas Kami</p>
            
            <form class="register-form" id="registerForm">
                <div class="form-group">
                    <label for="fullName">Nama Lengkap</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min. 8 karakter" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Ulangi password" required>
                </div>
                
                <div class="form-footer">
                    <label class="checkbox">
                        <input type="checkbox" name="terms" required>
                        <span>Saya setuju dengan <a href="#">Syarat & Ketentuan</a></span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang</button>
            </form>
            
            <p class="login-link">Sudah punya akun? <a href="login.html">Login di sini</a></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
