<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Last Candle</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">The Last Candle</h1>
            <p class="login-subtitle">Community Login</p>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email atau Username</label>
                    <input type="text" id="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                
                <div class="form-footer">
                    <label class="checkbox">
                        <input type="checkbox" name="remember">
                        <span>Ingat Saya</span>
                    </label>
                    <a href="#" class="forgot-password">Lupa Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            
            <p class="signup-link">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
